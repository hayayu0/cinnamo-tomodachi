<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sanrio-park [開発中]</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; }

      #dev-banner {
        position: fixed; top: 0; left: 0; right: 0;
        background: rgba(255, 200, 0, 0.85); color: #555;
        text-align: center; padding: 6px 0;
        font-size: 14px; font-weight: bold; z-index: 100;
        pointer-events: none; letter-spacing: 0.05em;
      }

      #description {
        position: fixed; top: 50px; left: 16px;
        font-weight: bold; color: darkblue; font-size: 13px;
        pointer-events: none;
      }

      #player-label {
        position: fixed; left: 16px; bottom: 72px; z-index: 10;
        font-size: 14px; font-weight: bold; color: #333;
        background: rgba(255, 255, 255, 0.85); padding: 4px 12px;
        border-radius: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      }

      #change-btn {
        position: fixed; left: 16px; bottom: 16px; z-index: 10;
        font-size: 16px; padding: 10px 20px; cursor: pointer;
        border: none; border-radius: 20px; background: #ffb6c1;
        color: #fff; font-weight: bold;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      }
      #change-btn:hover { background: #ff8fa3; }

      #notification {
        display: none;
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 230, 255, 0.97); color: #c04080;
        font-size: 26px; font-weight: bold;
        padding: 18px 36px; border-radius: 20px; z-index: 200;
        box-shadow: 0 4px 20px rgba(200, 100, 150, 0.4);
        pointer-events: none;
      }
      #notification.visible { display: block; }

      .speech-bubble {
        position: fixed;
        background: #fff;
        border: 2px solid #f0d0e0;
        border-radius: 14px;
        padding: 5px 11px;
        font-size: 13px;
        font-weight: bold;
        color: #444;
        pointer-events: none;
        z-index: 40;
        white-space: nowrap;
        transform: translate(-50%, calc(-100% - 14px));
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        transition: opacity 0.4s ease;
      }
      .speech-bubble::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 7px solid transparent;
        border-top-color: #f0d0e0;
      }
      .speech-bubble::before {
        content: '';
        position: absolute;
        top: calc(100% - 1px);
        left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent;
        border-top-color: #fff;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="dev-banner">【開発中】サンリオパーク</div>
    <div id="description">地面クリックで移動 ／ キャラクリックでリアクション</div>
    <div id="player-label">▶ シナモロール 操作中</div>
    <div id="notification"></div>
    <button id="change-btn" type="button">プレイヤー切替</button>
    <script type="module" src="./main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sanrio-park [開発中]</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; }
      #dev-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(255, 200, 0, 0.85);
        color: #555;
        text-align: center;
        padding: 6px 0;
        font-size: 14px;
        font-weight: bold;
        z-index: 100;
        pointer-events: none;
        letter-spacing: 0.05em;
      }
      #change-btn {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        font-size: 18px;
        padding: 10px 20px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      }
      #change-btn:hover { background: #f0f0f0; }
      #loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        align-items: center;
        justify-content: center;
        z-index: 50;
        letter-spacing: 0.1em;
      }
      #loading-overlay.visible { display: flex; }
    </style>
  </head>
  <body>
    <div id="dev-banner">【開発中】3Dサンリオ</div>
    <div id="loading-overlay">切替中…</div>
    <button id="change-btn" type="button">キャラ変更</button>
    <script type="module" src="./main.js"></script>
  </body>
</html>
